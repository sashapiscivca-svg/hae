name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[train,dev,hub]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Verify model and annotation checksums
        run: |
          (cd models && sha256sum -c SHA256SUMS)
          (cd data/annotations && sha256sum -c SHA256SUMS)
      - name: Tests
        run: pytest -q

  runtime-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime without PyTorch
        run: pip install -e .
      - name: Smoke test the CLI on the released model
        run: |
          python -c "import numpy as np; from PIL import Image; Image.fromarray((np.random.rand(512,640)*255).astype('uint8')).save('frame.png')"
          hae info hae-s-ir
          hae predict hae-s-ir frame.png --json
          python -c "import sys; assert 'torch' not in sys.modules"
